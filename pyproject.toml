[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "async-oj"
version = "1.7.0"
description = "Course Online Judge built with asynchronous FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "aiosqlite>=0.20,<1",
  "bcrypt>=4.1,<6",
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]
report = [
  "pdfplumber>=0.11,<1",
  "playwright>=1.50,<2",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
]

[tool.setuptools.packages.find]
include = ["oj*", "frontend*"]

[tool.setuptools.package-data]
frontend = ["assets/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["linux: resource-limit tests requiring Linux"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = true
