name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install compiler and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check oj frontend tests
      - name: Format check
        run: ruff format --check oj frontend tests
      - name: Type check
        run: mypy oj
      - name: Test with backend coverage gate
        run: pytest --cov=oj --cov-report=term-missing --cov-fail-under=80 -q

